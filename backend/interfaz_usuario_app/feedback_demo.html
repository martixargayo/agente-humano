<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Feedback Demo Fixtures</title>
    <style>
      body { margin:0; font-family: system-ui, sans-serif; background:#0b1220; color:#e2e8f0; }
      .wrap { max-width: 1024px; margin: 0 auto; padding: 20px; }
      .card { background:#111b2e; border:1px solid #334155; border-radius:12px; padding:14px; margin-bottom:14px; }
      .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
      select, button { background:#0f172a; color:#e2e8f0; border:1px solid #475569; border-radius:8px; padding:8px 10px; }
      .hidden { display:none; }
      .small { color:#94a3b8; font-size:13px; }

      #panelReport { background:#fafafa; border:none; padding:0; border-radius:0; margin:0; }
      #feedbackReportRoot { min-height: 100vh; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section id="panelSelect" class="card">
        <h2>Demo evaluación (fixtures input)</h2>
        <p class="small">Carril dev separado. Ejecuta el pipeline real de evaluación desde un fixture.</p>
        <div class="row">
          <label for="fixtureSelect">Fixture:</label>
          <select id="fixtureSelect"></select>
          <button id="runFixtureBtn" type="button">Ejecutar demo</button>
        </div>
        <p id="fixtureMeta" class="small"></p>
      </section>

      <section id="panelLoading" class="card hidden">
        <h3>Evaluación en curso...</h3>
        <p id="loadingText">Inicializando...</p>
      </section>

      <section id="panelError" class="card hidden">
        <h3>Error</h3>
        <p id="errorText"></p>
      </section>
    </main>

    <section id="panelReport" class="hidden" aria-live="polite">
      <div id="feedbackReportRoot"></div>
    </section>

    <script src="./feedback_report_view.js"></script>
    <script src="./feedback_demo.js"></script>
  </body>
</html>
