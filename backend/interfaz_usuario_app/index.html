<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Interfaz Usuario</title>
    <style>
      body{font-family:system-ui;margin:20px;max-width:900px}
      textarea{width:100%;height:90px}
      .row{display:flex;gap:8px;margin-bottom:8px}
      .chat{border:1px solid #ddd;padding:12px;border-radius:8px;min-height:180px;white-space:pre-wrap}
      .meta{font-size:12px;color:#555;margin-top:8px}
      .finish-negotiation-button{margin-left:auto;border:1px solid rgba(148,163,184,.45);background:rgba(71,85,105,.85);color:#e2e8f0;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;opacity:.82;transition:background .2s ease,border-color .2s ease,box-shadow .2s ease,opacity .2s ease}
      .finish-negotiation-button.is-armed{background:rgba(37,99,235,.95);border-color:rgba(147,197,253,.95);color:#fff;opacity:1;box-shadow:0 0 0 1px rgba(147,197,253,.35),0 8px 20px rgba(37,99,235,.25)}
    </style>
  </head>
  <body>
    <h1>interfaz_usuario (parity-safe)</h1>
    <div class="row">
      <input id="userId" value="u_interfaz" placeholder="user_id" />
      <input id="sessionId" value="interfaz-main" placeholder="session_id" />
      <button id="bootstrap">Bootstrap</button>
      <button id="newConv">Nueva conversación</button>
    </div>
    <div class="chat" id="chat"></div>
    <div class="row">
      <textarea id="msg" placeholder="Escribe un mensaje (negociación)"></textarea>
    </div>
    <div class="row">
      <button id="send">Enviar a negociación</button>
      <button id="finishNegotiationBtn" class="finish-negotiation-button" type="button" aria-label="Finalizar negociación">Finalizar negociación</button>
    </div>
    <div class="meta" id="meta"></div>
    <script src="./app.js"></script>
  </body>
</html>
