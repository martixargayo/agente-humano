<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Avatar 3D – Agente Humano</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"
      }
    }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(0,0,0,0.6);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      width: 360px;
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    #ui h1 {
      font-size: 16px;
      margin: 0 0 6px 0;
      letter-spacing: 0.03em;
    }

    #lastReply {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      color: #e5e7eb;
      max-width: 320px;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    textarea {
      width: 100%;
      border-radius: 6px;
      padding: 6px;
      resize: vertical;
      min-height: 60px;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      background: rgba(15,23,42,0.9);
      color: #e5e7eb;
    }

    button {
      cursor: pointer;
      font-family: inherit;
    }

    /* Panel de voz abajo a la izquierda */
    #voicePanel {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 15;
      width: 380px;
      background: rgba(8, 15, 30, 0.8);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.05);
      backdrop-filter: blur(8px);
    }

    #voicePanel h2 {
      margin: 0 0 8px;
      font-size: 15px;
      letter-spacing: 0.02em;
    }

    .voice-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .voice-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      font-size: 12px;
    }

    .voice-status {
      font-weight: 600;
      color: #a5b4fc;
    }

    .voice-status.listening { color: #22c55e; }
    .voice-status.auto { color: #fbbf24; }

    #voiceTranscript {
      min-height: 64px;
      border-radius: 8px;
      padding: 8px 10px;
      background: rgba(255,255,255,0.06);
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .voice-buttons button {
      flex: 1;
      border: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #0b1220;
      background: linear-gradient(135deg, #34d399, #10b981);
    }

    .voice-buttons button.stop {
      background: linear-gradient(135deg, #f97316, #ef4444);
      color: #fff;
    }

    .voice-buttons button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Elementos que se ocultan en modo solo voz */
    .hidden-while-voice {
      transition: opacity 0.2s ease, height 0.2s ease;
    }

    .voice-only .hidden-while-voice {
      opacity: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .voice-hint {
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <!-- Panel superior: modo chat/negociar + texto -->
  <div id="ui">
    <h1>Avatar 3D</h1>

    <div>
      <label>
        <input type="radio" name="agentMode" value="chat" checked />
        Chat normal
      </label>
      <label style="margin-left: 8px;">
        <input type="radio" name="agentMode" value="negociar" />
        Negociador
      </label>
    </div>

    <div id="textControls" class="hidden-while-voice" style="margin-top: 6px;">
      <textarea
        id="userText"
        rows="2"
        placeholder="Escribe aquí... (Ctrl/Cmd+Enter para enviar)"
      ></textarea>

      <div style="margin-top: 4px;">
        <label>
          <input type="checkbox" id="textOnly" />
          Solo texto (sin voz)
        </label>
      </div>

      <button id="sendToAgentBtn" style="margin-top: 6px; width: 100%;">
        Enviar al agente
      </button>
    </div>

    <div style="margin-top: 6px; font-size: 13px;">
      <label>
        <input type="checkbox" id="idleMotionToggle" checked />
        Movimiento idle (respiración / balanceo)
      </label>
    </div>

    <div style="margin-top: 6px; font-size: 12px;">
      Respuesta:
      <span id="lastReply"></span>
    </div>
  </div>

  <!-- Panel de voz dedicado -->
  <div id="voicePanel">
    <div class="voice-row" style="justify-content: space-between;">
      <h2 style="margin:0;">Zona de voz</h2>
      <label class="voice-pill" title="Oculta la caja de texto y centra la interacción en voz">
        <input type="checkbox" id="voiceModeToggle" />
        Solo voz
      </label>
    </div>

    <div class="voice-row">
      <span class="voice-pill">
        Estado:
        <span id="voiceStatus" class="voice-status">En espera</span>
      </span>
      <span
        class="voice-pill"
        id="voiceAutoPill"
        title="Se reactivará sola tras la respuesta del avatar"
        style="display:none;"
      >
        Autoescucha lista
      </span>
    </div>

    <div class="voice-row voice-buttons" style="margin-top: 10px;">
      <button id="voiceStartBtn">🎤 Hablar</button>
      <button id="voiceStopBtn" class="stop" disabled>⏹️ Enviar ahora</button>
    </div>

    <div id="voiceTranscript" style="margin-top: 8px;" aria-live="polite"></div>
    <div class="voice-hint">
      Pulsa Enter para detener y enviar el audio transcrito sin usar el ratón.
    </div>
  </div>

  <!-- Canvas del avatar -->
  <canvas id="c"></canvas>

  <script type="module" src="./app.js"></script>
</body>
</html>
