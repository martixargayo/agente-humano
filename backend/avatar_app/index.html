<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Avatar 3D – Agente Humano</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"
      }
    }
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(0,0,0,0.6);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      width: 340px;
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    #ui h1 {
      font-size: 16px;
      margin: 0 0 6px 0;
      letter-spacing: 0.03em;
    }
    #lastReply {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      color: #e5e7eb;
      max-width: 320px;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    textarea {
      width: 100%;
      border-radius: 6px;
      padding: 6px;
      resize: vertical;
      min-height: 60px;
    }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Avatar 3D</h1>
    <div>
      <label>
        <input type="radio" name="agentMode" value="chat" checked />
        Chat normal
      </label>
      <label style="margin-left: 8px;">
        <input type="radio" name="agentMode" value="negociar" />
        Negociador
      </label>
    </div>

    <div style="margin-top: 6px;">
      <textarea id="userText" rows="2" placeholder="Escribe aquí... (Ctrl/Cmd+Enter para enviar)"></textarea>
    </div>

    <div style="margin-top: 4px;">
      <label>
        <input type="checkbox" id="textOnly" />
        Solo texto (sin voz)
      </label>
    </div>

    <div style="margin-top: 6px; font-size: 13px;">
      <div style="margin-top: 6px;">
        <label>
          <input type="checkbox" id="idleMotionToggle" checked />
          Movimiento idle (respiración / balanceo)
        </label>
      </div>
    </div>

    <button id="sendToAgentBtn" style="margin-top: 6px; width: 100%;">Enviar al agente</button>

    <div style="margin-top: 6px;">
      <button id="micBtn">🎤 Hablar</button>
    </div>
    <canvas id="waveCanvas" width="320" height="40"
            style="margin-top:4px;background:rgba(15,23,42,0.9);border-radius:4px;"></canvas>
    <div id="micLabel" style="font-size:12px;margin-top:2px;color:#9ca3af;">
      Pulsa el micro y habla
    </div>

    <div style="margin-top: 6px; font-size: 12px;">
      Respuesta:
      <span id="lastReply"></span>
    </div>
  </div>

  <canvas id="c"></canvas>

  <script type="module" src="./app.js"></script>
</body>
</html>
