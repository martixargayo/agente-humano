<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Avatar 3D – Agente Humano</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --glass: rgba(15, 23, 42, 0.35);
      --glass-strong: rgba(15, 23, 42, 0.6);
      --border: rgba(148, 163, 184, 0.25);
      --text-muted: rgba(226, 232, 240, 0.7);
      --accent: #60a5fa;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.2), transparent 55%),
        radial-gradient(circle at 30% 20%, rgba(15, 23, 42, 0.18), transparent 60%),
        #000;
      color: #fff;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" stitchTiles="stitch"/></filter><rect width="120" height="120" filter="url(%23n)" opacity="0.03"/></svg>');
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    #c {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .listening-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.45s ease, visibility 0.45s ease;
      z-index: 3;
    }

    .listening-glow.active {
      opacity: 1;
      visibility: visible;
    }

    .glow-side {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 18vw;
      max-width: 240px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .glow-side.left { left: 0; }
    .glow-side.right { right: 0; transform: scaleX(-1); }

    .beam {
      height: 40%;
      border-radius: 0 120px 120px 0;
      background: linear-gradient(90deg, rgba(59, 130, 246, 0.55), rgba(59, 130, 246, 0.15), transparent 85%);
      filter: blur(18px);
      opacity: 0.9;
      transform-origin: center;
      animation: drift 6s ease-in-out infinite, breathe 4s ease-in-out infinite;
    }

    .beam-bottom {
      animation-delay: -2s;
      opacity: 0.7;
    }

    @keyframes drift {
      0%, 100% { transform: translateY(-4%); }
      50% { transform: translateY(4%); }
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .permission-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(2, 6, 23, 0.75);
      backdrop-filter: blur(10px);
      z-index: 5;
      padding: 24px;
    }

    .permission-card {
      width: min(420px, 92vw);
      padding: 28px 30px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.3);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .permission-card h1 {
      margin: 0 0 10px;
      font-size: 22px;
      letter-spacing: 0.01em;
    }

    .permission-card p {
      margin: 0 0 18px;
      color: var(--text-muted);
      font-size: 15px;
    }

    .primary-btn {
      width: 100%;
      padding: 12px 18px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(120deg, rgba(59, 130, 246, 0.9), rgba(37, 99, 235, 0.9));
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .primary-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(37, 99, 235, 0.25); }

    .error-text {
      margin-top: 12px;
      color: #f87171;
      font-size: 13px;
      min-height: 18px;
    }

    .reply-container {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 140px;
      width: min(720px, 90vw);
      padding: 12px 18px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.35);
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: rgba(226, 232, 240, 0.92);
      font-size: 14px;
      backdrop-filter: blur(10px);
      z-index: 4;
    }

    .reply-container.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .bottom-bar {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      width: min(820px, 94vw);
      z-index: 4;
    }

    .bar-inner {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 14px 18px 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
    }

    .bar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .mode-tabs {
      display: inline-flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 999px;
      padding: 4px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    .mode-tab {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
    }

    .mode-tab.active {
      background: rgba(59, 130, 246, 0.2);
      color: white;
    }

    .agent-toggle {
      display: inline-flex;
      gap: 6px;
      font-size: 12px;
    }

    .agent-toggle button {
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.35);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
    }

    .agent-toggle button.active {
      color: white;
      border-color: rgba(59, 130, 246, 0.6);
      background: rgba(59, 130, 246, 0.2);
    }

    .bar-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .bar-content.hidden { display: none; }

    .listen-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .input-orb {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(96, 165, 250, 0.8), rgba(59, 130, 246, 0.35));
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.35);
      transform: scale(var(--orb-scale, 0.85));
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .input-orb.inactive {
      opacity: 0.4;
      transform: scale(0.75);
      box-shadow: none;
    }

    .status-text {
      font-size: 13px;
      color: var(--text-muted);
    }

    .finish-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.6);
      color: white;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 12px;
    }

    .finish-button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .keycap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(15, 23, 42, 0.6);
      font-size: 12px;
      color: rgba(226, 232, 240, 0.9);
      box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.05);
    }

    .write-area {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .write-area textarea {
      flex: 1;
      resize: none;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.55);
      color: white;
      padding: 12px 14px;
      font-size: 14px;
      min-height: 42px;
      max-height: 120px;
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: rgba(59, 130, 246, 0.9);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .send-btn:hover { transform: translateY(-1px); }

    @media (max-width: 640px) {
      .reply-container { bottom: 150px; font-size: 13px; }
      .bar-content { flex-direction: column; align-items: flex-start; }
      .finish-button { width: 100%; justify-content: center; }
      .write-area { width: 100%; }
      .send-btn { align-self: flex-end; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="listeningGlow" class="listening-glow" aria-hidden="true">
    <div class="glow-side left">
      <span class="beam beam-top"></span>
      <span class="beam beam-bottom"></span>
    </div>
    <div class="glow-side right">
      <span class="beam beam-top"></span>
      <span class="beam beam-bottom"></span>
    </div>
  </div>

  <div id="permissionOverlay" class="permission-overlay" role="dialog" aria-modal="true">
    <div class="permission-card">
      <h1>Iniciar conversación</h1>
      <p>Necesitamos acceso al micrófono para conversar.</p>
      <button id="startBtn" class="primary-btn">Permitir y comenzar</button>
      <div id="permissionError" class="error-text" aria-live="polite"></div>
    </div>
  </div>

  <div id="replyContainer" class="reply-container hidden" aria-live="polite">
    <span id="lastReply"></span>
  </div>

  <div class="bottom-bar" aria-live="polite">
    <div class="bar-inner">
      <div class="bar-top">
        <div class="mode-tabs" role="tablist" aria-label="Modo de entrada">
          <button id="modeTalk" class="mode-tab active" role="tab" aria-selected="true">Hablar</button>
          <button id="modeWrite" class="mode-tab" role="tab" aria-selected="false">Escribir</button>
        </div>
        <div class="agent-toggle" role="group" aria-label="Modo del agente">
          <button id="agentChat" class="active" aria-pressed="true">Chat</button>
          <button id="agentNegotiation" aria-pressed="false">Negociar</button>
        </div>
      </div>

      <div id="talkMode" class="bar-content">
        <div class="listen-left">
          <div id="inputOrb" class="input-orb inactive" aria-hidden="true"></div>
          <div id="statusText" class="status-text">Listo</div>
        </div>
        <button id="finishTurnBtn" class="finish-button" aria-label="Finalizar turno de voz">
          <span class="keycap">⏎ Enter</span>
          <span>Finalizar</span>
        </button>
      </div>

      <div id="writeMode" class="bar-content hidden">
        <div class="write-area">
          <textarea id="textInput" rows="1" placeholder="Escribe tu mensaje..."></textarea>
          <button id="sendTextBtn" class="send-btn" aria-label="Enviar mensaje">➤</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
