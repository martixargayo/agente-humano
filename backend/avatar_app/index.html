<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Avatar 3D – Agente Humano</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --avatar-bg-image: none;
      --glass: #ffffff;
      --glass-strong: #ffffff;
      --border: #e2e8f0;
      --text-muted: #475569;
      --text-primary: #0f172a;
      --surface-radius: 24px;
      --surface-shadow: 0 28px 56px rgba(15, 23, 42, 0.22);
      --accent: #60a5fa;
      --accent-pastel: #bfdbfe;
      --atlas-cyan: #67e8f9;
      --atlas-cobalt: rgba(29, 78, 216, 0.55);
      --atlas-black: #000;
      --glow-width: min(25vw, 240px);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #000;
      color: #fff;
    }

    #stage {
      position: fixed;
      inset: 0;
      background-color: #000;
      z-index: 0;
      overflow: hidden;
    }

    #bg {
      position: absolute;
      inset: 0;
      background-color: #000;
      background-image: var(--avatar-bg-image);
      background-repeat: no-repeat;
      background-position: center center;
      background-size: contain;
      z-index: 0;
    }

    html[data-avatar-theme="dark"] #bg {
      --avatar-bg-image: url('./assets/bg/Gemini_Generated_Image_rymww6rymww6rymw.jpg');
    }

    #bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 45%, rgba(0, 0, 0, 0) 34%, rgba(0, 0, 0, 0.22) 78%, rgba(0, 0, 0, 0.45) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.14) 0%, rgba(0, 0, 0, 0.28) 100%);
      pointer-events: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" stitchTiles="stitch"/></filter><rect width="120" height="120" filter="url(%23n)" opacity="0.03"/></svg>');
      opacity: 0.2;
      pointer-events: none;
      z-index: 1;
    }


    :root[data-avatar-theme="realistic"] {
      color-scheme: light;
      --glass: #ffffff;
      --glass-strong: #ffffff;
      --border: #e2e8f0;
      --text-muted: #475569;
      --text-primary: #0f172a;
      --surface-shadow: 0 28px 56px rgba(15, 23, 42, 0.22);
    }

    html[data-avatar-theme="realistic"],
    html[data-avatar-theme="realistic"] body,
    html[data-avatar-theme="realistic"] #stage,
    html[data-avatar-theme="realistic"] #bg {
      background-color: #fff !important;
    }

    html[data-avatar-theme="realistic"] #bg {
      --avatar-bg-image: none;
      background-image: none !important;
    }

    html[data-avatar-theme="realistic"] #bg::after,
    html[data-avatar-theme="realistic"] body::before {
      content: none !important;
      background: none !important;
    }

    #c {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: block;
    }

    .listening-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      z-index: 3;
    }

    .listening-glow.active {
      opacity: 1;
      visibility: visible;
    }

    .glow-side {
      position: absolute;
      top: 0;
      bottom: 0;
      width: var(--glow-width);
      opacity: 0;
      transform: translateX(-6%) scale(0.96);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .listening-glow.active .glow-side {
      opacity: 1;
      transform: translateX(0%) scale(1);
    }

    .glow-side.left { left: 0; }
    .glow-side.right { right: 0; transform: translateX(6%) scale(0.96) scaleX(-1); }

    .listening-glow.active .glow-side.right {
      transform: translateX(0%) scale(1) scaleX(-1);
    }

    .beam-layer {
      position: absolute;
      inset: 0;
      animation: atlasBreathe 4s ease-in-out infinite;
      transform-origin: left center;
    }

    .glow-side.right .beam-layer {
      animation-delay: -0.5s;
    }

    .beam-layer.core {
      background:
        radial-gradient(120% 60% at 0% 50%,
          rgba(103, 232, 249, 0.55) 0%,
          rgba(29, 78, 216, 0.35) 35%,
          rgba(0, 0, 0, 0) 70%);
      filter: blur(18px);
      opacity: 0.7;
    }

    .beam-layer.soft {
      background:
        radial-gradient(120% 80% at 0% 50%,
          rgba(103, 232, 249, 0.22) 0%,
          rgba(29, 78, 216, 0.18) 45%,
          rgba(0, 0, 0, 0) 78%);
      filter: blur(32px);
      opacity: 0.6;
    }

    .beam-layer.halftone {
      background-image:
        radial-gradient(circle, rgba(103, 232, 249, 0.35) 0 1px, transparent 2px);
      background-size: 10px 10px;
      background-position: 0 0;
      opacity: 0.55;
      filter: blur(0.4px);
      -webkit-mask-image: linear-gradient(90deg, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 75%);
      mask-image: linear-gradient(90deg, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 75%);
    }

    @keyframes atlasBreathe {
      0%, 100% {
        opacity: 0.35;
        transform: translateX(-1.5%) scale(0.98);
      }
      50% {
        opacity: 0.75;
        transform: translateX(0%) scale(1.02);
      }
    }

    .permission-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(2, 6, 23, 0.75);
      backdrop-filter: blur(10px);
      z-index: 5;
      padding: 24px;
    }

    .permission-card {
      width: min(420px, 92vw);
      padding: 28px 30px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.3);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .permission-card h1 {
      margin: 0 0 10px;
      font-size: 22px;
      letter-spacing: 0.01em;
    }

    .permission-card p {
      margin: 0 0 18px;
      color: var(--text-muted);
      font-size: 15px;
    }

    .primary-btn {
      width: 100%;
      padding: 12px 18px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(120deg, rgba(59, 130, 246, 0.9), rgba(37, 99, 235, 0.9));
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .primary-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(37, 99, 235, 0.25); }

    .error-text {
      margin-top: 12px;
      color: #f87171;
      font-size: 13px;
      min-height: 18px;
    }

    .reply-container {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 140px;
      width: min(720px, 90vw);
      padding: 12px 18px;
      border-radius: 24px;
      background: var(--accent-pastel);
      border: 1px solid rgba(96, 165, 250, 0.6);
      color: #1e3a8a;
      font-size: 14px;
      z-index: 4;
      transition: opacity 0.35s ease, transform 0.35s ease;
      transform: translateX(-50%) translateY(0);
    }

    .reply-container.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(6px);
      pointer-events: none;
    }

    .bottom-bar {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      width: min(820px, 94vw);
      z-index: 4;
    }

    .bar-inner {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--surface-radius);
      padding: 14px 18px 16px;
      box-shadow: var(--surface-shadow);
    }

    .bar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .conversation-mode {
      position: relative;
      margin-left: auto;
    }

    .conversation-mode-trigger {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 114px;
      gap: 1px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.45);
      color: var(--text-primary);
      padding: 7px 10px 6px;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      transition: border-color 0.18s ease, transform 0.18s ease, background 0.18s ease;
    }

    .conversation-mode-trigger:hover {
      transform: translateY(-1px);
      border-color: rgba(96, 165, 250, 0.55);
    }

    .conversation-mode-trigger .mode-current {
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      letter-spacing: 0.01em;
    }

    .conversation-mode-trigger .mode-chevron {
      font-size: 14px;
      line-height: 1;
      color: #cbd5e1;
      transform: translateY(1px);
    }

    .conversation-mode-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 170px;
      background: rgba(2, 6, 23, 0.96);
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.38);
      display: none;
      z-index: 8;
    }

    .conversation-mode.open .conversation-mode-menu {
      display: block;
    }

    .conversation-mode-option {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #cbd5e1;
      padding: 8px 10px;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
    }

    .conversation-mode-option:hover {
      background: rgba(96, 165, 250, 0.12);
      color: #e2e8f0;
    }

    .conversation-mode-option.active {
      background: rgba(96, 165, 250, 0.18);
      color: #e2e8f0;
      font-weight: 600;
    }

    .conversation-mode-option.active::after {
      content: "✓";
      color: #93c5fd;
    }

    .mode-tabs {
      display: inline-flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 999px;
      padding: 4px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    .mode-tab {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
    }

    .mode-tab.active {
      background: rgba(59, 130, 246, 0.2);
      color: white;
    }

    .agent-toggle {
      display: inline-flex;
      gap: 6px;
      font-size: 12px;
    }

    .agent-toggle button {
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.35);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
    }

    .agent-toggle button.active {
      color: white;
      border-color: rgba(59, 130, 246, 0.6);
      background: rgba(59, 130, 246, 0.2);
    }

    .bar-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .bar-content.hidden { display: none; }

    .listen-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .input-orb {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(96, 165, 250, 0.8), rgba(59, 130, 246, 0.35));
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.35);
      transform: scale(var(--orb-scale, 0.85));
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .input-orb.inactive {
      opacity: 0.4;
      box-shadow: none;
    }

    .status-text {
      font-size: 13px;
      color: var(--text-muted);
    }

    .finish-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 16px;
      border: 1px solid rgba(96, 165, 250, 0.7);
      background: var(--accent-pastel);
      color: #1e3a8a;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .finish-button.highlight {
      animation: finishPulse 0.8s ease;
      box-shadow: 0 0 18px rgba(96, 165, 250, 0.45);
    }

    .finish-button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .keycap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(15, 23, 42, 0.6);
      font-size: 12px;
      color: rgba(226, 232, 240, 0.9);
      box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.05);
    }


    html[data-avatar-theme="realistic"] .mode-tabs {
      background: rgba(255, 255, 255, 0.68);
      border-color: rgba(15, 23, 42, 0.18);
    }

    html[data-avatar-theme="realistic"] .mode-tab.active {
      color: var(--text-primary);
    }

    html[data-avatar-theme="realistic"] .conversation-mode-trigger {
      background: rgba(255, 255, 255, 0.86);
      border-color: rgba(15, 23, 42, 0.15);
    }

    html[data-avatar-theme="realistic"] .conversation-mode-trigger .mode-current,
    html[data-avatar-theme="realistic"] .conversation-mode-trigger .mode-chevron {
      color: #0f172a;
    }

    html[data-avatar-theme="realistic"] .conversation-mode-menu {
      background: rgba(255, 255, 255, 0.97);
      border-color: rgba(15, 23, 42, 0.12);
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.16);
    }

    html[data-avatar-theme="realistic"] .conversation-mode-option {
      color: rgba(15, 23, 42, 0.82);
    }

    html[data-avatar-theme="realistic"] .conversation-mode-option:hover,
    html[data-avatar-theme="realistic"] .conversation-mode-option.active {
      color: #0f172a;
    }

    html[data-avatar-theme="realistic"] .agent-toggle button,
    html[data-avatar-theme="realistic"] .finish-button,
    html[data-avatar-theme="realistic"] .keycap,
    html[data-avatar-theme="realistic"] .write-area textarea {
      background: var(--glass-strong);
      border-color: rgba(15, 23, 42, 0.18);
      color: var(--text-primary);
    }

    @keyframes finishPulse {
      0% { transform: scale(1); }
      45% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .write-area {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .write-area textarea {
      flex: 1;
      resize: none;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.55);
      color: white;
      padding: 12px 14px;
      font-size: 14px;
      min-height: 42px;
      max-height: 120px;
    }

    .send-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 16px;
      border: 1px solid rgba(96, 165, 250, 0.7);
      background: var(--accent-pastel);
      color: #1e3a8a;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: transform 0.2s ease;
    }

    .send-btn-enter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 8px;
      border: 1px solid rgba(96, 165, 250, 0.7);
      background: rgba(255, 255, 255, 0.55);
      font-size: 12px;
      color: #1e3a8a;
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .send-btn:hover { transform: translateY(-1px); }

    html[data-newbox="1"] .bar-inner {
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 26px;
      padding: 12px 16px;
      backdrop-filter: none;
      box-shadow:
        0 14px 34px rgba(15, 23, 42, 0.14),
        0 2px 6px rgba(15, 23, 42, 0.08);
    }

    html[data-newbox="1"] .bar-top {
      margin-bottom: 8px;
    }

    html[data-newbox="1"] .mode-tabs {
      background: #f3f4f6;
      border-color: rgba(15, 23, 42, 0.08);
      padding: 5px;
    }

    html[data-newbox="1"] .mode-tab {
      color: rgba(15, 23, 42, 0.7);
    }

    html[data-newbox="1"] .mode-tab.active {
      background: #ffffff;
      color: #111827;
      box-shadow: 0 2px 5px rgba(15, 23, 42, 0.12);
    }

    html[data-newbox="1"] .conversation-mode-trigger {
      background: #f9fafb;
      border-color: rgba(15, 23, 42, 0.12);
    }

    html[data-newbox="1"] .conversation-mode-trigger .mode-current,
    html[data-newbox="1"] .conversation-mode-trigger .mode-chevron {
      color: #111827;
    }

    html[data-newbox="1"] .conversation-mode-menu {
      background: #ffffff;
      border-color: rgba(15, 23, 42, 0.1);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.14);
    }

    html[data-newbox="1"] .conversation-mode-option {
      color: rgba(15, 23, 42, 0.86);
    }

    html[data-newbox="1"] .status-text {
      color: rgba(15, 23, 42, 0.74);
    }

    html[data-newbox="1"] .finish-button {
      border-color: rgba(15, 23, 42, 0.12);
      background: #f9fafb;
      color: #111827;
    }

    html[data-newbox="1"] .keycap {
      border-color: rgba(15, 23, 42, 0.16);
      background: #ffffff;
      color: rgba(15, 23, 42, 0.8);
    }

    html[data-newbox="1"] .write-area textarea {
      border-radius: 18px;
      border: 1px solid rgba(15, 23, 42, 0.12);
      background: #ffffff;
      color: #111827;
      min-height: 44px;
    }

    html[data-newbox="1"] .write-area textarea::placeholder {
      color: rgba(15, 23, 42, 0.48);
    }

    html[data-newbox="1"] .send-btn {
      width: 38px;
      height: 38px;
      background: #030712;
      color: #ffffff;
      font-size: 17px;
      box-shadow: 0 5px 16px rgba(3, 7, 18, 0.32);
    }

    @media (max-width: 640px) {
      .reply-container { bottom: 150px; font-size: 13px; }
      .bar-content { flex-direction: column; align-items: flex-start; }
      .finish-button { width: 100%; justify-content: center; }
      .write-area { width: 100%; }
      .send-btn { align-self: flex-end; }
      .bar-top { align-items: flex-start; }
      .conversation-mode { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="bg" aria-hidden="true"></div>
    <canvas id="c"></canvas>
  </div>

  <div id="listeningGlow" class="listening-glow" aria-hidden="true">
    <div class="glow-side left">
      <span class="beam-layer core"></span>
      <span class="beam-layer soft"></span>
      <span class="beam-layer halftone"></span>
    </div>
    <div class="glow-side right">
      <span class="beam-layer core"></span>
      <span class="beam-layer soft"></span>
      <span class="beam-layer halftone"></span>
    </div>
  </div>

  <div id="permissionOverlay" class="permission-overlay" role="dialog" aria-modal="true">
    <div class="permission-card">
      <h1>Iniciar conversación</h1>
      <p>Necesitamos acceso al micrófono para conversar.</p>
      <button id="startBtn" class="primary-btn">Permitir y comenzar</button>
      <div id="permissionError" class="error-text" aria-live="polite"></div>
    </div>
  </div>

  <div id="replyContainer" class="reply-container hidden" aria-live="polite">
    <span id="lastReply"></span>
  </div>

  <div class="bottom-bar" aria-live="polite">
    <div class="bar-inner">
      <div class="bar-top">
        <div class="mode-tabs" role="tablist" aria-label="Modo de entrada">
          <button id="modeTalk" class="mode-tab active" role="tab" aria-selected="true">Hablar</button>
          <button id="modeWrite" class="mode-tab" role="tab" aria-selected="false">Escribir</button>
        </div>
        <div id="conversationMode" class="conversation-mode">
          <button
            id="conversationModeTrigger"
            class="conversation-mode-trigger"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="conversationModeMenu"
            aria-label="Seleccionar modo de conversación"
          >
            <span id="conversationModeCurrent" class="mode-current">Chat</span>
            <span class="mode-chevron">▾</span>
          </button>
          <div id="conversationModeMenu" class="conversation-mode-menu" role="menu" aria-label="Modo de conversación">
            <button type="button" class="conversation-mode-option active" role="menuitemradio" aria-checked="true" data-agent-mode="chat">Chat</button>
            <button type="button" class="conversation-mode-option" role="menuitemradio" aria-checked="false" data-agent-mode="negotiation">Negociación</button>
          </div>
        </div>
      </div>

      <div id="talkMode" class="bar-content">
        <div class="listen-left">
          <div id="inputOrb" class="input-orb inactive" aria-hidden="true"></div>
          <div id="statusText" class="status-text">Listo</div>
        </div>
        <button id="finishTurnBtn" class="finish-button" aria-label="Finalizar turno de voz">
          <span class="keycap">⏎ Enter</span>
          <span>Finalizar</span>
        </button>
      </div>

      <div id="writeMode" class="bar-content hidden">
        <div class="write-area">
          <textarea id="textInput" rows="1" placeholder="Escribe tu mensaje..."></textarea>
          <button id="sendTextBtn" class="send-btn" aria-label="Enviar mensaje">
            <span class="send-btn-enter">↵ Enter</span>
            <span>Finalizar</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js?v=motionfix3"></script>
</body>
</html>
