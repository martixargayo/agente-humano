<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avatar 3D – Agente Humano</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"
      }
    }
  </script>

  <!-- ✅ NUEVO: UI minimal -->
  <link rel="stylesheet" href="./ui.css" />
</head>

<!--
  Para previsualizar el glow sin JS todavía, prueba a poner:
  <body class="mode-ready">  o  <body class="mode-listening">
  Luego el JS lo controlará dinámicamente.
-->
<body class="mode-speaking">

  <!-- =========================
       0) Canvas 3D full-screen
  ========================== -->
  <canvas id="c"></canvas>

  <!-- =========================
       1) Glow Atlas Layer (esquinas)
       pointer-events: none
  ========================== -->
  <div id="atlasGlowLayer" aria-hidden="true">
    <div class="atlas-corner tl"></div>
    <div class="atlas-corner tr"></div>
    <div class="atlas-corner bl"></div>
    <div class="atlas-corner br"></div>
  </div>

  <!-- =========================
       2) Voice Pact (permiso) - overlay
       (JS lo mostrará/ocultará)
  ========================== -->
  <div id="voicePact" class="overlayCard is-hidden" role="dialog" aria-modal="true" aria-labelledby="voicePactTitle">
    <div class="card">
      <div class="badge">Modo voz</div>
      <h2 id="voicePactTitle">Activa el micrófono automático</h2>
      <p>
        Para una conversación fluida, necesito permiso para activar el micro automáticamente cuando sea tu turno.
      </p>

      <div class="row">
        <button id="voicePactEnableBtn" class="btnPrimary" type="button">
          Activar modo voz
        </button>
        <button id="voicePactSkipBtn" class="btnGhost" type="button">
          Ahora no
        </button>
      </div>

      <p class="fineprint">
        Puedes cambiar a escribir en cualquier momento.
      </p>
    </div>
  </div>

  <!-- =========================
       3) Voice HUD (abajo-izquierda)
       Mantiene IDs existentes: micBtn, waveCanvas, micLabel
  ========================== -->
  <div id="voiceHud" class="hud voiceHud">
    <div class="voicePill">
      <div class="waveWrap" aria-hidden="true">
        <canvas id="waveCanvas" width="220" height="34"></canvas>
      </div>

      <button id="voiceStopBtn" class="pillBtn" type="button">
        Space para enviar
      </button>
    </div>

    <div class="voiceSubRow">
      <!-- Mantengo micBtn para tu app.js actual -->
      <button id="micBtn" class="linkBtn" type="button" title="Hablar">
        Hablar
      </button>

      <button id="switchToTextBtn" class="linkBtn" type="button">
        Escribir
      </button>

      <span id="micLabel" class="micLabel">Pulsa para hablar</span>
    </div>
  </div>

  <!-- =========================
       4) Text Bar (abajo-centro)
       Mantiene IDs existentes: userText, sendToAgentBtn
  ========================== -->
  <div id="textBar" class="hud textBar">
    <div class="textPill">
      <button id="textMicBtn" class="iconBtn" type="button" title="Volver a voz" aria-label="Volver a voz">
        🎤
      </button>

      <!-- Mantengo userText para tu app.js actual -->
      <textarea id="userText" rows="1" placeholder="Escribe un mensaje..."></textarea>

      <!-- Mantengo sendToAgentBtn para tu app.js actual -->
      <button id="sendToAgentBtn" class="sendBtn" type="button" aria-label="Enviar">
        ↑
      </button>
    </div>
  </div>

  <!-- =========================
       5) Respuesta texto (mínima)
       Mantengo lastReply para tu app.js
  ========================== -->
  <div id="replyToast" class="replyToast is-hidden" aria-live="polite">
    <span class="label">Respuesta</span>
    <span id="lastReply"></span>
  </div>

  <!-- =========================
       6) Legacy panel (oculto)
       Mantengo IDs por compatibilidad si aún los usas
  ========================== -->
  <div id="legacyPanel" class="legacyPanel" hidden>
    <div>
      <label><input type="radio" name="agentMode" value="chat" checked /> Chat normal</label>
      <label style="margin-left: 8px;"><input type="radio" name="agentMode" value="negociar" /> Negociador</label>
    </div>
    <label><input type="checkbox" id="textOnly" /> Solo texto (sin voz)</label>
    <label><input type="checkbox" id="idleMotionToggle" checked /> Movimiento idle</label>
  </div>

  <!-- Tu app principal -->
  <script type="module" src="./app.js"></script>
</body>
</html>
