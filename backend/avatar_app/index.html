<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avatar 3D – Agente Humano</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"
      }
    }
  </script>

  <link rel="stylesheet" href="./ui.css" />
</head>

<body class="mode-init">

  <!-- 0) Canvas 3D full-screen -->
  <canvas id="c"></canvas>

  <!-- 1) Atlas Glow Layer (cuñas) -->
  <div id="atlasGlowLayer" aria-hidden="true">
    <div class="atlas-wedge tl"></div>
    <div class="atlas-wedge tr"></div>
    <div class="atlas-wedge bl"></div>
    <div class="atlas-wedge br"></div>
  </div>

  <!-- 2) Voice Pact (permiso) - overlay -->
  <div id="voicePact" class="overlayCard is-hidden" role="dialog" aria-modal="true" aria-labelledby="voicePactTitle">
    <div class="card">
      <div class="badge">Modo voz</div>
      <h2 id="voicePactTitle">Activa el micrófono automático</h2>
      <p>
        Para una conversación fluida, necesito permiso para activar el micro automáticamente cuando sea tu turno.
      </p>

      <div class="row">
        <button id="voicePactEnableBtn" class="btnPrimary" type="button">
          Activar modo voz
        </button>
        <button id="voicePactSkipBtn" class="btnGhost" type="button">
          Ahora no
        </button>
      </div>

      <p class="fineprint">
        Puedes cambiar a escribir en cualquier momento.
      </p>
    </div>
  </div>

  <!-- 3) INPUT DOCK ÚNICO (abajo-centro) -->
  <div id="inputDock" class="dock" aria-label="Entrada">
    <div class="dockToggle" role="tablist" aria-label="Modo de entrada">
      <button id="dockModeVoice" class="dockTab is-active" type="button" role="tab" aria-selected="true">
        Hablar
      </button>
      <button id="dockModeText" class="dockTab" type="button" role="tab" aria-selected="false">
        Escribir
      </button>
    </div>

    <div class="dockPill" role="group" aria-label="Entrada">
      <!-- VOICE BODY -->
      <div id="dockVoiceBody" class="dockBody dockBodyVoice" aria-hidden="false">
        <div class="dockWaveWrap" aria-hidden="true">
          <canvas id="dockWaveCanvas" width="520" height="28"></canvas>
        </div>
      </div>

      <!-- TEXT BODY -->
      <div id="dockTextBody" class="dockBody dockBodyText is-hidden" aria-hidden="true">
        <textarea id="dockTextInput" rows="1" placeholder="Escribe un mensaje..."></textarea>
      </div>

      <!-- ACTION -->
      <button id="dockActionBtn" class="dockActionBtn" type="button" aria-label="Acción">
        <span id="dockActionIconMic" class="dockActionIcon">🎤</span>
        <span id="dockActionIconSend" class="dockActionIcon is-hidden">↑</span>
        <span id="dockKeycap" class="dockKeycap">space</span>
      </button>
    </div>
  </div>

  <!-- 4) Respuesta texto (mínima) -->
  <div id="replyToast" class="replyToast is-hidden" aria-live="polite">
    <span class="label">Respuesta</span>
    <span id="lastReply"></span>
  </div>

  <!-- 5) Legacy panel (oculto) -->
  <div id="legacyPanel" class="legacyPanel" hidden>
    <div>
      <label><input type="radio" name="agentMode" value="chat" checked /> Chat normal</label>
      <label style="margin-left: 8px;"><input type="radio" name="agentMode" value="negociar" /> Negociador</label>
    </div>
    <label><input type="checkbox" id="textOnly" /> Solo texto (sin voz)</label>
    <label><input type="checkbox" id="idleMotionToggle" checked /> Movimiento idle</label>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
